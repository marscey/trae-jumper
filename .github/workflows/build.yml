name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        type: string
      platform:
        description: '构建平台'
        required: true
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - windows-x64
      create_release:
        description: '创建 Release'
        required: true
        type: boolean
        default: false

jobs:
  macos-arm64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-arm64' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build
      - name: Rename DMG
        run: |
          mv src-tauri/target/release/bundle/dmg/*.dmg "src-tauri/target/release/bundle/dmg/TraeJumper-${{ inputs.version }}-mac-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: src-tauri/target/release/bundle/dmg/TraeJumper-${{ inputs.version }}-mac-arm64.dmg

  macos-x64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos-x64' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add x86_64-apple-darwin
      - run: npm install
      - run: npx tauri build --target x86_64-apple-darwin
      - name: Rename DMG
        run: |
          mv src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/TraeJumper-${{ inputs.version }}-mac-x64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/TraeJumper-${{ inputs.version }}-mac-x64.dmg

  windows-x64:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows-x64' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tauri build
      - name: Rename EXE
        run: |
          Move-Item src-tauri\target\release\bundle\nsis\*.exe "src-tauri\target\release\bundle\nsis\TraeJumper-${{ inputs.version }}-win-x64-setup.exe" -Force
      - name: Rename MSI
        run: |
          Move-Item src-tauri\target\release\bundle\msi\*.msi "src-tauri\target\release\bundle\msi\TraeJumper-${{ inputs.version }}-win-x64.msi" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/TraeJumper-${{ inputs.version }}-win-x64-setup.exe
            src-tauri/target/release/bundle/msi/TraeJumper-${{ inputs.version }}-win-x64.msi

  release:
    if: ${{ inputs.create_release && always() }}
    needs: [macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=$(find artifacts -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' \))
          echo "Attaching files:"
          echo "$FILES"
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "TraeJumper v${{ inputs.version }}" \
            --notes "请编辑此 Release 说明" \
            --draft \
            $FILES
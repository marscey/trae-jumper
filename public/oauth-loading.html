<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TraeJumper OAuth</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #f6f7f9;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }
    .box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .ring {
      width: 42px;
      height: 42px;
      margin: 0 auto 20px;
      border: 3px solid #dbe3f0;
      border-top-color: #1b8fff;
      border-radius: 50%;
      animation: tj-spin 0.8s linear infinite;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
      color: #1f2329;
      margin-bottom: 8px;
    }
    .sub {
      font-size: 12.5px;
      color: #8a8f9c;
      line-height: 1.6;
    }
    .err {
      display: none;
      margin-top: 18px;
      font-size: 12px;
      color: #e5484d;
      max-width: 320px;
      word-break: break-all;
    }
    @keyframes tj-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="ring"></div>
    <div class="title">正在打开 Trae 授权页面…</div>
    <div class="sub">网络较慢时可能需要等待十几秒，请稍候<br />请勿关闭此窗口</div>
    <div class="err" id="err"></div>
  </div>
  <script>
    // authorize_url 由 Rust 端 initialization_script 在本文档脚本执行前注入：
    // window.__OAUTH_TARGET__ = "https://www.trae.cn/authorization?...";
    (function () {
      var tries = 0;
      function go() {
        var u = window.__OAUTH_TARGET__;
        if (u && typeof u === "string") {
          // replace：WKWebView 在新页面首字节到达前会保持渲染当前页，
          // 从而用本 loading 页覆盖远程页面连接/TTFB 期间的白屏。
          window.location.replace(u);
          return true;
        }
        return false;
      }
      if (!go()) {
        var timer = setInterval(function () {
          if (go() || ++tries > 200) { // 6s 兜底
            clearInterval(timer);
            if (tries > 200 && !window.__OAUTH_TARGET__) {
              var e = document.getElementById("err");
              e.style.display = "block";
              e.textContent = "授权地址注入失败，请取消后重新点击 OAuth 授权登录";
            }
          }
        }, 30);
      }
    })();
  </script>
</body>
</html>
